# ESPHome: DPG Bluetooth pressure gauge (SECA app) -> Home Assistant + CYD.
# Protocol decoded from nRF Connect reads on 2026-11-22; basic operation confirmed.
# All multibyte fields below are little-endian:
#   df471524: int32 at bytes 2-5 = current pressure, scaled by decimal places.
#             Bytes 10-13 and 16-19 have unknown semantics; intentionally unused.
#   df47152b: byte 1 = unit (1: psi, 6: mbar); byte 2 = decimal places.
#   df471525: uint32 x3 = current/min/max interval (observed 1000/100/10000 ms).

substitutions:
  gauge_mac: "D3:31:E8:2F:CC:51"
  svc: "df471523-9da9-47cb-abf2-44ba6959979b"
  # Elegoo 2.8-inch ESP32-32E / E32R28T: ILI9341 and CYD-compatible LCD pins.
  # Controller and pinout checked against Elegoo/LCDwiki documentation.
  display_model: "ILI9341"

esphome:
  name: pressure-gauge-bridge
  friendly_name: Pressure Gauge Bridge
  min_version: 2026.11.0
  includes:
    - pressure_statistics.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
api:
  # Keep the local gauge running even when Home Assistant is offline.
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

globals:
  - id: unit_code
    type: int
    initial_value: "-1"  # Unknown until read on each connection.
  - id: decimals
    type: int
    initial_value: "-1"
  - id: gauge_connected
    type: bool
    initial_value: "false"

# One gauge connection; save RAM for LVGL.
esp32_ble:
  max_connections: 1

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: ${gauge_mac}
    id: dpg
    on_connect:
      - lambda: |-
          id(gauge_connected) = true;
          id(unit_code) = -1;
          id(decimals) = -1;
          id(dpg_unit).publish_state(NAN);
      # Notify characteristics are not automatically read on connection.
      # Allow notification registration to finish, then read unit/precision.
      - delay: 1s
      - if:
          condition:
            lambda: return id(gauge_connected);
          then:
            - component.update: dpg_unit
    on_disconnect:
      - lambda: |-
          id(gauge_connected) = false;
          id(unit_code) = -1;
          id(decimals) = -1;
          id(dpg_unit).publish_state(NAN);

binary_sensor:
  - platform: template
    name: "Gauge connected"
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(gauge_connected);

# Minimum spacing between valid pressure reports to Home Assistant, in seconds.
# The local display still receives every gauge notification.
number:
  - platform: template
    id: pressure_report_interval
    name: "Pressure reporting interval"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "s"
    mode: box
    min_value: 0.1
    max_value: 60
    step: 0.1
    initial_value: 1
    optimistic: true
    restore_value: true

# Completed-window statistics have their own period, independent of live reports.
select:
  - platform: template
    id: pressure_statistics_period
    name: "Pressure statistics period"
    icon: mdi:timer-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "1 minute"
    options:
      - "1 minute"
      - "5 minutes"
      - "10 minutes"
      - "15 minutes"
      - "30 minutes"
      - "60 minutes"
    on_value:
      - lambda: |-
          const uint32_t periods_ms[] = {
            60000U, 300000U, 600000U, 900000U, 1800000U, 3600000U
          };
          // Restored at boot as well as when changed. Discard partial windows;
          // the previous completed results remain until a new full window ends.
          dpg_statistics::statistics.set_period(millis(), periods_ms[i]);

# Poll unit metadata only while connected; avoid warnings while the gauge is off.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: return id(gauge_connected);
          then:
            - component.update: dpg_unit
  # Publish on schedule even if the gauge is disconnected or stops notifying.
  - interval: 1s
    then:
      - lambda: |-
          dpg_statistics::statistics.advance(millis(), [](const dpg_statistics::PressureSummary &result) {
            id(minimum_pressure).publish_state(result.minimum);
            id(maximum_pressure).publish_state(result.maximum);
            id(average_pressure).publish_state(result.average);
          });

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: dpg
    id: dpg_unit
    name: "Gauge unit code"
    entity_category: diagnostic
    service_uuid: ${svc}
    characteristic_uuid: "df47152b-9da9-47cb-abf2-44ba6959979b"
    notify: true
    # Also read periodically: some gauges only notify when the unit changes.
    update_interval: never
    accuracy_decimals: 0
    lambda: |-
      if (x.size() < 3 || x[2] > 9) {
        ESP_LOGW("dpg", "Invalid unit/precision packet");
        return NAN;
      }
      const bool changed = id(unit_code) != x[1] || id(decimals) != x[2];
      id(unit_code) = x[1];
      id(decimals) = x[2];
      if (changed) {
        // Do not reinterpret the previous reading using new units.
        id(dpg_pressure).publish_state(NAN);
        ESP_LOGI("dpg", "Gauge unit code %d, decimals %d", id(unit_code), id(decimals));
      }
      return (float) x[1];
    on_value:
      - if:
          condition:
            lambda: return !std::isfinite(x);
          then:
            - lambda: |-
                id(unit_code) = -1;
                id(decimals) = -1;
                id(dpg_pressure).publish_state(NAN);

  # Always report psi to HA and the screen, regardless of the gauge's unit.
  - platform: ble_client
    type: characteristic
    ble_client_id: dpg
    id: dpg_pressure
    name: "Pressure stream"
    internal: true
    service_uuid: ${svc}
    characteristic_uuid: "df471524-9da9-47cb-abf2-44ba6959979b"
    notify: true
    # Stream notifications without injecting periodic GATT pressure reads.
    update_interval: never
    device_class: pressure
    state_class: measurement
    unit_of_measurement: "psi"
    accuracy_decimals: 2
    # The observed maximum reporting interval is 10s. Clear stopped streams.
    filters:
      - timeout: 30s
    lambda: |-
      if (x.size() < 6 || id(decimals) < 0 || id(decimals) > 9) return NAN;
      int32_t raw = (int32_t) ((uint32_t) x[2] | ((uint32_t) x[3] << 8) |
                               ((uint32_t) x[4] << 16) | ((uint32_t) x[5] << 24));
      float v = raw / powf(10.0f, id(decimals));
      switch (id(unit_code)) {
        case 1: return v;
        case 6: return v * 0.0145038f;
        default:
          ESP_LOGW("dpg", "Unknown unit code %d; set gauge to psi or mbar", id(unit_code));
          return NAN;
      }
    on_value:
      - lambda: |-
          dpg_statistics::statistics.sample(millis(), x, [](const dpg_statistics::PressureSummary &result) {
            id(minimum_pressure).publish_state(result.minimum);
            id(maximum_pressure).publish_state(result.maximum);
            id(average_pressure).publish_state(result.average);
          });
      - if:
          condition:
            lambda: return std::isfinite(x);
          then:
            - lvgl.label.update:
                id: pressure_value
                text:
                  format: "%.2f"
                  args: [x]
            - lvgl.label.update:
                id: gauge_status
                text: "Live"
                text_color: 0x64D8A0
          else:
            - lvgl.label.update:
                id: pressure_value
                text: "--.--"
            - lvgl.label.update:
                id: gauge_status
                text: !lambda |-
                  if (!id(gauge_connected)) return "Gauge disconnected";
                  if (id(decimals) < 0) return "Waiting for unit data";
                  if (id(unit_code) != 1 && id(unit_code) != 6) return "Unsupported gauge unit";
                  return "Waiting for pressure data";
                text_color: 0xFFCA70

  # Keep the public entity named Pressure so HA retains its existing identity.
  - platform: copy
    source_id: dpg_pressure
    id: dpg_pressure_ha
    name: "Pressure"
    filters:
      - lambda: |-
          static uint32_t last_report_ms = 0;
          static bool previous_invalid = true;
          // Never delay disconnects, invalid metadata, or the 30s stream timeout.
          if (!std::isfinite(x)) {
            previous_invalid = true;
            return x;
          }
          const uint32_t now = millis();
          const uint32_t interval_ms = static_cast<uint32_t>(
              lroundf(id(pressure_report_interval).state * 1000.0f));
          // Also send the first valid reading after startup/recovery immediately.
          // Unsigned subtraction keeps this working across millis() rollover.
          if (previous_invalid || now - last_report_ms >= interval_ms) {
            previous_invalid = false;
            last_report_ms = now;
            return x;
          }
          return {};

  - platform: template
    id: minimum_pressure
    name: "Minimum pressure"
    device_class: pressure
    state_class: measurement
    unit_of_measurement: "psi"
    accuracy_decimals: 2
    # Emit each completed window, including when its value is unchanged.
    force_update: true
    update_interval: never

  - platform: template
    id: maximum_pressure
    name: "Maximum pressure"
    device_class: pressure
    state_class: measurement
    unit_of_measurement: "psi"
    accuracy_decimals: 2
    # Emit each completed window, including when its value is unchanged.
    force_update: true
    update_interval: never

  - platform: template
    id: average_pressure
    name: "Average pressure"
    device_class: pressure
    state_class: measurement
    unit_of_measurement: "psi"
    accuracy_decimals: 2
    # Emit each completed window, including when its value is unchanged.
    force_update: true
    update_interval: never

# Write-only SPI avoids GPIO12, a boot strapping pin on the original CYD.
# No touchscreen is needed to view this interface.
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "Display backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

display:
  - platform: mipi_spi
    id: tft_display
    model: ${display_model}
    spi_id: tft_spi
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    auto_clear_enabled: false
    update_interval: never

lvgl:
  rotation: 90
  displays:
    - tft_display
  # ~18 KiB instead of a 150 KiB full-screen buffer; leave RAM for BLE/Wi-Fi.
  buffer_size: 12%
  default_font: montserrat_16
  bg_color: 0x101820
  text_color: 0xF1F5F9
  widgets:
    - label:
        text: "PRESSURE"
        align: TOP_MID
        y: 22
        text_color: 0x94A3B8
    - label:
        id: pressure_value
        text: "--.--"
        text_font: montserrat_48
        align: CENTER
        y: -14
    - label:
        text: "psi"
        text_font: montserrat_24
        text_color: 0x94A3B8
        align: CENTER
        y: 35
    - label:
        id: gauge_status
        text: "Connecting to gauge..."
        text_color: 0xFFCA70
        align: BOTTOM_MID
        y: -22
