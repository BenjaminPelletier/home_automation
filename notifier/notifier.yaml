substitutions:
  device_name: atom-notifier
  friendly_name: Atom Notifier
  led_brightness: "50%"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0

# ATOMS3 Lite: ESP32-S3FN8, 8 MB flash, no PSRAM.
esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret notifier_api_encryption_key
  # Keep the local notification active if Home Assistant is offline.
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Reuse the native API key for encrypted wireless firmware updates.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep the local notification active during a Wi-Fi outage, too.
  reboot_timeout: 0s

# Expose only the selector so separate light commands cannot conflict with it.
select:
  - platform: template
    id: notification_state
    name: Notification state
    icon: mdi:traffic-light
    optimistic: true
    options:
      - "Clear"
      - "Good"
      - "Bad"
    initial_option: "Clear"
    restore_value: false
    set_action:
      - if:
          condition:
            lambda: 'return x == "Good";'
          then:
            - light.turn_on:
                id: notification_led
                brightness: ${led_brightness}
                red: 0%
                green: 100%
                blue: 0%
                effect: "None"
          else:
            - if:
                condition:
                  lambda: 'return x == "Bad";'
                then:
                  - light.turn_on:
                      id: notification_led
                      brightness: ${led_brightness}
                      red: 100%
                      green: 0%
                      blue: 0%
                      effect: "Slow red blink"
                else:
                  # Turning off also stops the blinking effect.
                  - light.turn_off: notification_led

light:
  - platform: esp32_rmt_led_strip
    id: notification_led
    internal: true
    pin: GPIO35
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: "Slow red blink"
          colors:
            - state: true
              brightness: ${led_brightness}
              red: 100%
              green: 0%
              blue: 0%
              duration: 1s
            - state: false
              duration: 1s

binary_sensor:
  - platform: gpio
    id: acknowledge_button
    internal: true
    pin:
      number: GPIO41
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - select.set:
          id: notification_state
          option: "Clear"
