# ESPHome config: "DPG" Bluetooth pressure gauge (SECA app) -> Home Assistant
# Draft, untested. Protocol decoded from nRF Connect reads on 2026-11-22.
#
# Protocol notes (all little-endian):
#   Service      df471523-9da9-47cb-abf2-44ba6959979b
#   Meas data    df471524-...  (notify)  int32 @ bytes 2-5 = current reading (scaled)
#                                        int32 @ bytes 10-13 = 60 psi in current unit (range or alarm?)
#                                        int32 @ bytes 16-19 = same as current (min? TBD)
#   Unit         df47152b-...  (notify)  byte 1 = unit code (1 = psi, 6 = mbar, others TBD)
#                                        byte 2 = decimal places
#   Meas rate    df471525-...            uint32 x3 = current / min / max interval in ms (1000/100/10000)

substitutions:
  gauge_mac: "D3:31:E8:2F:CC:51"
  svc: "df471523-9da9-47cb-abf2-44ba6959979b"

esphome:
  name: pressure-gauge-bridge
  friendly_name: Pressure Gauge Bridge

esp32:
  board: esp32dev
  framework:
    type: esp-idf   # recommended for BLE client use

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: unit_code
    type: int
    initial_value: "1"   # psi
  - id: decimals
    type: int
    initial_value: "2"

esp32_ble_tracker:

ble_client:
  - mac_address: ${gauge_mac}
    id: dpg

sensor:
  # Unit/decimals: kept in globals so the pressure sensor can scale correctly.
  - platform: ble_client
    type: characteristic
    ble_client_id: dpg
    id: dpg_unit
    name: "Gauge unit code"
    entity_category: diagnostic
    service_uuid: ${svc}
    characteristic_uuid: "df47152b-9da9-47cb-abf2-44ba6959979b"
    notify: true
    accuracy_decimals: 0
    lambda: |-
      if (x.size() < 3) return NAN;
      id(unit_code) = x[1];
      id(decimals) = x[2];
      return (float) x[1];

  # Pressure, always reported to HA in psi regardless of the gauge's display unit.
  - platform: ble_client
    type: characteristic
    ble_client_id: dpg
    id: dpg_pressure
    name: "Pressure"
    service_uuid: ${svc}
    characteristic_uuid: "df471524-9da9-47cb-abf2-44ba6959979b"
    notify: true
    device_class: pressure
    state_class: measurement
    unit_of_measurement: "psi"
    accuracy_decimals: 2
    lambda: |-
      if (x.size() < 6) return NAN;
      int32_t raw = (int32_t) ((uint32_t) x[2] | ((uint32_t) x[3] << 8) |
                               ((uint32_t) x[4] << 16) | ((uint32_t) x[5] << 24));
      float v = raw / powf(10.0f, id(decimals));
      switch (id(unit_code)) {
        case 1: return v;               // psi
        case 6: return v * 0.0145038f;  // mbar -> psi
        default:
          ESP_LOGW("dpg", "Unknown unit code %d (raw %d); set gauge to psi", id(unit_code), raw);
          return NAN;
      }
