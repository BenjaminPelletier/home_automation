<svg xmlns="http://www.w3.org/2000/svg" width="323" height="262" viewBox="0 0 323 262" role="img" aria-labelledby="title description">
  <title id="title">Pump connector pinout</title>
  <desc id="description">Male pins viewed from the face of the receptacle. Counter-clockwise from the key: 1 +5V out, 2 and 3 RS-485 (unconfirmed), 4 Speed 1, 5 Speed 2, 6 Speed 3, 7 Quick Clean. Center: 8 GND.</desc>

  <rect width="323" height="262" fill="#f4f4f5"/>
  <circle cx="160" cy="129" r="85.5" fill="none" stroke="#202124" stroke-width="3"/>
  <rect x="151" y="36" width="18" height="16" fill="#f4f4f5" stroke="#202124" stroke-width="2.5"/>

  <g font-family="system-ui, sans-serif">
    <g fill="#202124" font-size="12">
      <text x="160" y="28" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5">KEY</text>
      <text x="114" y="39" text-anchor="end">+5V out</text>
      <text x="58" y="110" text-anchor="end">RS-485 ?</text>
      <text x="78" y="199" text-anchor="end">RS-485 ?</text>
      <text x="160" y="250" text-anchor="middle">Speed 1</text>
      <text x="243" y="199">Speed 2</text>
      <text x="263" y="110">Speed 3</text>
      <text x="206" y="39">Quick Clean</text>
      <text x="160" y="108" text-anchor="middle">GND</text>
    </g>

    <g fill="#fff" font-size="15" font-weight="700" text-anchor="middle">
      <circle cx="135" cy="76" r="13" fill="#ce382d"/>
      <text x="135" y="81">1</text>
      <circle cx="103" cy="116" r="13" fill="#6d4dc9"/>
      <text x="103" y="121">2</text>
      <circle cx="114" cy="166" r="13" fill="#6d4dc9"/>
      <text x="114" y="171">3</text>
      <circle cx="160" cy="188" r="13" fill="#187b8e"/>
      <text x="160" y="193">4</text>
      <circle cx="206" cy="166" r="13" fill="#187b8e"/>
      <text x="206" y="171">5</text>
      <circle cx="218" cy="116" r="13" fill="#187b8e"/>
      <text x="218" y="121">6</text>
      <circle cx="186" cy="76" r="13" fill="#187b8e"/>
      <text x="186" y="81">7</text>
      <circle cx="160" cy="129" r="13" fill="#545b65"/>
      <text x="160" y="134">8</text>
    </g>
  </g>
</svg>
